# Runs on every PR and on main the same two gates /autodev and /autoship run locally:
# the typecheck from .claude/autopilot.config.json and autopilot/test/stacked-merge.sh.
# The job names are .git.protection.requiredChecks in that config — rename them together.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: a failing jq fails the step, not just bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          bash -c 'echo "bash $BASH_VERSION"'
          git --version   # stacked-merge.sh needs ≥ 2.28 (git init -b)
          jq --version

      - name: Typecheck (.commands.typecheck)
        # read from the config, so CI and the local <typecheck> gate can't drift apart
        run: jq -r .commands.typecheck .claude/autopilot.config.json | bash

      - name: stacked-merge.sh
        run: autopilot/test/stacked-merge.sh

      - name: stacked-merge.sh under /bin/bash 3.2
        if: runner.os == 'macOS'
        # `bash` on PATH resolves to /bin/bash here, so the gh stub, the bare repo's hook and every
        # `bash -c` in the test run on 3.2 as well, not only the top-level script
        run: |
          mkdir "$RUNNER_TEMP/bash-3.2"
          ln -s /bin/bash "$RUNNER_TEMP/bash-3.2/bash"
          export PATH="$RUNNER_TEMP/bash-3.2:$PATH"
          bash -c 'echo "bash $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" = 3 ]' || { echo "/bin/bash is not bash 3" >&2; exit 1; }
          bash autopilot/test/stacked-merge.sh
