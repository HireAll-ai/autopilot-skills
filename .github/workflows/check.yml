# Runs on every PR and on main the same gates /autodev and /autoship run locally, from
# .claude/autopilot.config.json: the typecheck and the tests (autopilot/test/stacked-merge.sh,
# autopilot/test/config.sh, autopilot/test/verify-deploy.sh). The job names are
# .git.protection.requiredChecks in that config — rename them together.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: a failing jq fails the step, not just bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          bash -c 'echo "bash $BASH_VERSION"'
          git --version   # stacked-merge.sh needs ≥ 2.28 (git init -b)
          jq --version

      - name: Typecheck (.commands.typecheck)
        # read from the config, so CI and the local <typecheck> gate can't drift apart
        run: jq -r .commands.typecheck .claude/autopilot.config.json | bash

      - name: stacked-merge.sh
        run: autopilot/test/stacked-merge.sh

      - name: config.sh
        run: autopilot/test/config.sh

      - name: verify-deploy.sh
        run: autopilot/test/verify-deploy.sh

      - name: /bin/bash 3.2 for the steps below
        if: runner.os == 'macOS'
        # they put this dir first on PATH: `bash` then resolves to /bin/bash, so the gh stub, the bare
        # repo's hook, every `bash -c` and every `#!/usr/bin/env bash` script the tests run (the
        # lib/*.sh under test among them) are on 3.2 as well, not only the top-level script
        run: |
          mkdir "$RUNNER_TEMP/bash-3.2"
          ln -s /bin/bash "$RUNNER_TEMP/bash-3.2/bash"
          "$RUNNER_TEMP/bash-3.2/bash" -c 'echo "bash $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" = 3 ]' || { echo "/bin/bash is not bash 3" >&2; exit 1; }

      - name: stacked-merge.sh under /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          export PATH="$RUNNER_TEMP/bash-3.2:$PATH"
          bash autopilot/test/stacked-merge.sh

      - name: config.sh under /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          export PATH="$RUNNER_TEMP/bash-3.2:$PATH"
          bash autopilot/test/config.sh

      - name: verify-deploy.sh under /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          export PATH="$RUNNER_TEMP/bash-3.2:$PATH"
          bash autopilot/test/verify-deploy.sh
