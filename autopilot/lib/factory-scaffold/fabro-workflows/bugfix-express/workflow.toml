_version = 1

[workflow]
graph = "workflow.fabro"

[run.environment]
id = "local"

# Local execution runs hooks and agents on this machine.
# Once Docker/Daytona is configured, switch to a sandboxed environment.
[environments.local]
provider = "local"

# Managed run branches give every run its own branch with per-stage checkpoint
# commits and a recorded base_sha — this is what populates the Files Changed
# tab (visible already at Gate 1). push is required by run.pull_request.
[run.run_branch]
enabled = true
push = true

[run.meta_branch]
enabled = true
push = true

[run.checkpoint]
exclude_globs = ["**/node_modules/**", "**/.cache/**", "**/factory-artifacts/**", "**/dist/**"]
